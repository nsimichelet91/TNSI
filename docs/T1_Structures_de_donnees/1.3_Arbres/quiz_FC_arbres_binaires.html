<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flashcards : Arbres Binaires</title>
  <style>
    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
      margin: 0;
      padding: 20px;
      color: #2c3e50;
    }
    h1 { margin-bottom: 10px; }
    p { color: #555; }

    .flashcards-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      margin-top: 30px;
      max-width: 1200px;
      margin-left: auto;
      margin-right: auto;
    }

    .flashcard {
      perspective: 1000px;
      cursor: pointer;
      height: 220px;
    }

    .flashcard-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.6s;
      transform-style: preserve-3d;
      border-radius: 15px;
      box-shadow: 0 6px 12px rgba(0,0,0,0.15);
    }

    .flashcard.flipped .flashcard-inner {
      transform: rotateY(180deg);
    }

    .flashcard-front, .flashcard-back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      box-sizing: border-box;
      font-size: 17px;
      border-radius: 15px;
      white-space: pre-line;
      text-align: center;
      flex-direction: column;
    }

    .flashcard-front {
      background: #ffffff;
      border: 2px solid #e0e0e0;
    }

    .flashcard-back {
      background: #dff9fb;
      transform: rotateY(180deg);
      border: 2px solid #b2bec3;
      text-align: left;
    }

    pre {
      background: #f4f4f4;
      padding: 10px;
      border-radius: 8px;
      overflow-x: auto;
      width: 100%;
    }

    code {
      font-family: Consolas, monospace;
      font-size: 15px;
    }

    button {
      background: #0984e3;
      color: white;
      border: none;
      padding: 12px 24px;
      margin: 30px auto;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    button:hover { background: #74b9ff; }
  </style>
</head>
<body>

<h1>Flashcards : Rappels sur les Arbres Binaires</h1>
<p>Clique sur une carte pour voir la réponse !</p>

<div class="flashcards-container" id="flashcards-container"></div>

<button onclick="melangerFlashcards()">Mélanger les cartes</button>

<script>
const flashcardsData = [

{ question: "Un arbre est composé de ... reliés entre eux par des liens appelés ...", answer: "Nœuds — Arêtes" },
{ question: "Le ... est le nœud situé au sommet de l’arbre.", answer: "La racine" },
{ question: "Un nœud sans enfant est appelé une ...", answer: "Feuille" },
{ question: "La ... d’un arbre correspond au nombre de nœuds qu’il contient.", answer: "Taille" },
{ question: "La ... d’un arbre correspond à la longueur du plus long chemin jusqu’à une feuille.", answer: "Hauteur" },
{ question: "Un arbre où chaque nœud n’a qu’un seul enfant est appelé un ...", answer: "Arbre peigne" },
{ question: "Un arbre complet est un arbre où tous les niveaux sauf le dernier sont remplis et où les feuilles sont le plus à gauche possible.", answer: "Arbre complet" },

// taille/hauteur/feuilles
{ question: "Taille de l’arbre illustré ?", answer: "7" },
{ question: "Hauteur de l’arbre illustré ?", answer: "4" },
{ question: "Nombre de feuilles ?", answer: "3 (D, E, G)" },

// définitions parcours
{ question: "On visite la racine en premier : parcours ...", answer: "Préfixe" },
{ question: "On visite la racine en dernier : parcours ...", answer: "Suffixe" },
{ question: "La racine est visitée entre le sous-arbre gauche et droit : parcours ...", answer: "Infixe" },

// Ordres parcours arbre
{ question: "Parcours préfixe : ...", answer: "A B D E C F G" },
{ question: "Parcours infixe : ...", answer: "D B E A C F G" },
{ question: "Parcours suffixe : ...", answer: "D E B G F C A" },

// Compléter programme
{ 
  question: "Compléter la fonction Python pour la taille :\n",
  answer: `<pre><code class="language-python">
return 1 + taille(arbre.gauche) + taille(arbre.droit)
</code></pre>` 
},

// Rôle de fonction mystère
{ 
  question: "Quel est le rôle de cette fonction ?\n<pre><code class='language-python'>def mystere(arbre):\n    if arbre is None:\n        return -1\n    gauche = mystere(arbre.gauche)\n    droite = mystere(arbre.droit)\n    return 1 + max(gauche, droite)</code></pre>",
  answer: "Elle calcule la hauteur de l’arbre."
},

// identifier parcours
{ 
  question: "Quel type de parcours ?\n<pre><code class='language-python'>def parcours(r):\n    if r is not None:\n        parcours(r.gauche)\n        parcours(r.droit)\n        print(r.valeur)</code></pre>",
  answer: "Parcours suffixe (post-order)"
},

// relation hauteur taille arbre peigne
{ question: "Arbre peigne — hauteur ?", answer: "4" },
{ question: "Arbre peigne — taille ?", answer: "4" },
{ question: "Relation h ≤ n ≤ 2^h − 1 respectée ? (Arbre peigne)", answer: "Oui" },

// arbre complet
{ question: "Arbre complet — hauteur ?", answer: "3" },
{ question: "Arbre complet — taille ?", answer: "7" },
{ question: "Relation h ≤ n ≤ 2^h − 1 respectée ? (Arbre complet)", answer: "Oui" },

// Implémentation
{ question: "Dans cette implémentation Python, comment représente-t-on un arbre vide ?", answer: "Avec la valeur None." },

// test vide
{ question: "Comment tester qu’un arbre est vide ?", answer: "if arbre is None" }

];

function creerFlashcards() {
  const container = document.getElementById("flashcards-container");
  container.innerHTML = "";
  flashcardsData.forEach(card => {
    const flashcard = document.createElement("div");
    flashcard.className = "flashcard";
    flashcard.onclick = function() {
      this.classList.toggle("flipped");
    };
    flashcard.innerHTML = `
      <div class="flashcard-inner">
        <div class="flashcard-front">${card.question}</div>
        <div class="flashcard-back">${card.answer}</div>
      </div>`;
    container.appendChild(flashcard);
  });
}

function melangerFlashcards() {
  for (let i = flashcardsData.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [flashcardsData[i], flashcardsData[j]] = [flashcardsData[j], flashcardsData[i]];
  }
  creerFlashcards();
}

window.onload = creerFlashcards;
</script>

</body>
</html>
